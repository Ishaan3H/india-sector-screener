name: Weekly refresh

# Runs on GitHub's servers, so the screener keeps updating whether or not any
# particular laptop is switched on.

on:
  schedule:
    # 05:00 UTC Saturday = 10:30 IST. Friday's 15:30 IST close has settled into
    # the daily price series by then (it is often still missing late Friday night).
    - cron: "0 5 * * 6"
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # to commit the refreshed data back
  pages: write              # to publish the page
  id-token: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependency install step: the project is standard library only.
      - name: Fetch prices and rebuild the page
        run: |
          python screener.py
          python render.py

      - name: Sanity-check the output
        run: python check_output.py

      - name: Commit the refreshed week
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No change since last run - nothing to commit."
          else
            week=$(python -c "import json;d=json.load(open('data.json'));print(d['week_start'],'to',d['week_end'])")
            git commit -m "Weekly refresh: $week"
            git push
          fi

      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
