name: Weekly refresh

# Runs on GitHub's servers, so the screener keeps updating whether or not any
# particular laptop is switched on.

on:
  schedule:
    # 01:00 UTC Sunday = 06:30 IST Sunday.
    #
    # Deliberately NOT Saturday. Yahoo backfills Friday's DAILY bars slowly and
    # unevenly - on 29 Aug 2026 a 11:26 UTC Saturday run still saw no Friday bar
    # for any symbol, and the index series lagged the stocks by another six hours.
    # A Saturday run therefore clips Friday off the week every time, which is not
    # visible in the output: it just quietly reports a four-session week. Sunday
    # morning is ~39h after the close and comfortably clear of the lag.
    - cron: "0 1 * * 0"
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # to commit the refreshed data back
  pages: write              # to publish the page
  id-token: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # No dependency install step: the project is standard library only.
      - name: Fetch prices and rebuild the page
        run: |
          python screener.py
          python render.py

      - name: Sanity-check the output
        run: python check_output.py

      - name: Commit the refreshed week
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No change since last run - nothing to commit."
          else
            week=$(python -c "import json;d=json.load(open('data.json'));print(d['week_start'],'to',d['week_end'])")
            git commit -m "Weekly refresh: $week"
            git push
          fi

      - name: Stage the site
        run: |
          mkdir -p site
          cp index.html site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
